<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bojji</title>
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(fonts/inter-latin-wght-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(fonts/inter-latin-ext-wght-normal.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  :root {
    color-scheme: light dark;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;

    --bg: #ffffff;
    --sidebar: #f2f1f6;
    --fg: #1d1d1f;
    --fg-2: #6e6e73;
    --fg-3: #66666b;
    --line: #e5e5ea;
    --fill: #f2f2f5;
    --select: #ffe27a;
    --select-fg: #1d1d1f;
    --select-quiet: #e8e7ec;
    --fg-on-quiet: #5c5c61;
    --accent: #b07d00;
    --check: #e0a800;
    --check-mark: #1d1d1f;
    --danger: #b8000f;
    --focus: #0071e3;
    --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .08);

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --r-row: 8px; --r-field: 9px;
    --sidebar-w: 240px; --list-w: 320px;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --sidebar: #252528;
      --fg: #f5f5f7;
      --fg-2: #a1a1a6;
      --fg-3: #8e8e93;
      --line: #38383a;
      --fill: #2c2c2e;
      --select: #6b5410;
      --select-fg: #fff6d6;
      --select-quiet: #3a3a3c;
      --fg-on-quiet: #c7c7cc;
      --accent: #ffd426;
      --check: #ffcc00;
      --check-mark: #1c1c1e;
      --danger: #ff6961;
      --focus: #4da3ff;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .4);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss03';
    overflow: hidden;
  }
  ::selection { background: var(--select); color: var(--select-fg); }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .app { display: grid; grid-template-columns: var(--sidebar-w) var(--list-w) 1fr; height: 100dvh; }

  /* Sidebar */
  .sidebar { background: var(--sidebar); display: flex; flex-direction: column; padding: var(--s5) var(--s3) var(--s3); min-height: 0; }
  .brand { font-size: 13px; font-weight: 600; color: var(--fg-2); padding: 0 var(--s2) var(--s4); letter-spacing: .01em; }
  .group { margin-bottom: var(--s5); }
  .group h2 { font-size: 11px; font-weight: 600; color: var(--fg-3); margin: 0 0 var(--s1); padding: 0 var(--s2); }
  .nav-item {
    width: 100%; display: flex; align-items: center; gap: var(--s2);
    height: 32px; padding: 0 var(--s2); border-radius: var(--r-row); text-align: left; color: var(--fg);
  }
  .nav-item .i { color: var(--accent); }
  .nav-item .count { margin-left: auto; color: var(--fg-3); font-variant-numeric: tabular-nums; font-size: 13px; }
  .nav-item:hover { background: var(--select-quiet); }
  .nav-item[aria-current="true"] { background: var(--select-quiet); font-weight: 600; }
  .sync {
    margin-top: auto; display: flex; align-items: center; gap: var(--s2);
    padding: var(--s3) var(--s2) var(--s1); border-top: 1px solid var(--line); color: var(--fg-2); font-size: 12px;
  }
  .sync > .i { width: 16px; height: 16px; align-self: flex-start; margin-top: 2px; }
  .sync .text { display: grid; line-height: 1.4; min-width: 0; flex: 1; }
  .sync .who { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }
  .sync .name { color: var(--fg); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sync .who time { margin-left: auto; color: var(--fg-3); font-variant-numeric: tabular-nums; flex: none; }
  .sync .where { color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sync a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; border-radius: 4px; }
  .sync a .i { width: 12px; height: 12px; }
  .sync a:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
  .sync[data-state="saving"] > .i { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* List pane */
  .list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
  .toolbar { display: flex; align-items: center; gap: var(--s2); height: 52px; padding: 0 var(--s3) 0 var(--s4); flex: none; }
  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-row); color: var(--fg-2); }
  .icon-btn:hover { background: var(--fill); color: var(--fg); }
  .icon-btn.back { display: none; color: var(--accent); width: auto; gap: 2px; padding-right: var(--s2); font-size: 16px; }
  .icon-btn.back .i { width: 22px; height: 22px; }
  .icon-btn.back span { color: var(--fg); }
  .search {
    flex: 1; display: flex; align-items: center; gap: var(--s2); height: 30px; padding: 0 var(--s2);
    background: var(--fill); border-radius: var(--r-field); color: var(--fg-3);
  }
  .search .i { width: 15px; height: 15px; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--fg); }
  .search input::placeholder { color: var(--fg-3); }
  .list-head { display: flex; align-items: baseline; justify-content: space-between; padding: var(--s2) var(--s4) var(--s3); flex: none; }
  .list-head h1 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
  .list-head .total { font-size: 26px; font-weight: 600; color: var(--fg-3); font-variant-numeric: tabular-nums; }
  .list-head .range { margin: 2px 0 0; color: var(--fg-2); font-size: 13px; }
  .day { margin-bottom: var(--s2); }
  .day-head { display: flex; align-items: baseline; gap: var(--s2); margin: 0; padding: var(--s4) var(--s3) var(--s1); font-size: 15px; font-weight: 600; }
  .day-head .date { color: var(--fg-2); font-weight: 400; font-size: 13px; }
  .day.past .day-head { color: var(--fg-2); }
  .day.today .day-head span:first-child::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: var(--s2); border-radius: 50%; background: var(--check); vertical-align: middle; }
  .day-empty { margin: 0; padding: var(--s1) var(--s3) var(--s2) 44px; color: var(--fg-3); font-size: 13px; }
  .row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); margin-top: 2px; }
  .note-row .row-meta { margin-top: var(--s1); }
  /* Matte tag palette: each tag keeps one hue, picked from its name. */
  .t0 { --tbg: #e3ebe1; --tfg: #3d5a3a; } /* sage */
  .t1 { --tbg: #f1e2da; --tfg: #7a3f26; } /* clay */
  .t2 { --tbg: #e0e6ef; --tfg: #34507a; } /* slate */
  .t3 { --tbg: #f0e8d2; --tfg: #6b5410; } /* mustard */
  .t4 { --tbg: #ebe0ea; --tfg: #6a3762; } /* plum */
  .t5 { --tbg: #dceceb; --tfg: #23595a; } /* teal */
  .t6 { --tbg: #f2e0e2; --tfg: #823a46; } /* rose */
  .t7 { --tbg: #e8e6e1; --tfg: #55524a; } /* stone */
  @media (prefers-color-scheme: dark) {
    .t0 { --tbg: #2f3a2e; --tfg: #b9d1b4; }
    .t1 { --tbg: #3d2c25; --tfg: #e6b9a2; }
    .t2 { --tbg: #283241; --tfg: #b0c3e3; }
    .t3 { --tbg: #3a3220; --tfg: #e3cd8d; }
    .t4 { --tbg: #382a37; --tfg: #dcb6d6; }
    .t5 { --tbg: #223635; --tfg: #a6d4d2; }
    .t6 { --tbg: #3d2a2d; --tfg: #e8b3bb; }
    .t7 { --tbg: #34332f; --tfg: #cfccc3; }
  }
  .tag {
    display: inline-flex; align-items: center; gap: 2px; height: 20px; padding: 0 7px; border-radius: 10px;
    background: var(--tbg, var(--fill)); color: var(--tfg, var(--fg-2)); font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap;
  }
  button.tag:hover, .tag-editor .tag:hover { background: color-mix(in srgb, var(--tbg) 82%, var(--tfg)); }
  .nav-item.tagged .i { color: var(--tfg); }
  .tag-editor { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
  .tag-editor .tag { height: 26px; padding: 0 4px 0 10px; border-radius: 13px; font-size: 13px; }
  .tag-editor .tag > button:first-child { color: inherit; }
  .tag-remove { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; color: inherit; opacity: .7; }
  .tag-remove:hover { opacity: 1; background: color-mix(in srgb, var(--tbg) 70%, var(--tfg)); }
  .tag-remove .i { width: 12px; height: 12px; }
  .tag-editor input { flex: 1; min-width: 10ch; border: 0; background: none; outline: none; padding: var(--s1) 0; color: var(--fg); }
  .tag-editor input::placeholder { color: var(--fg-3); }
  .section-head { margin: 0; padding: var(--s5) var(--s3) var(--s1); font-size: 15px; font-weight: 600; }
  .section-toggle { display: block; padding: var(--s4) var(--s3) var(--s2); color: var(--fg-2); font-size: 13px; font-weight: 500; }
  .section-toggle:hover { color: var(--fg); }
  .note-row { cursor: pointer; }
  .rows { flex: 1; overflow-y: auto; padding: 0 var(--s2) var(--s5); }
  .empty { color: var(--fg-3); text-align: center; padding: var(--s7) var(--s4); }

  .note-row { width: 100%; display: block; text-align: left; padding: var(--s2) var(--s3); border-radius: var(--r-row); position: relative; }
  .note-row + .note-row::before { content: ""; position: absolute; top: 0; left: var(--s3); right: var(--s3); border-top: 1px solid var(--line); }
  .note-row[aria-current="true"]::before, .note-row[aria-current="true"] + .note-row::before { display: none; }
  .note-row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-row .meta { display: flex; gap: var(--s2); color: var(--fg-2); font-size: 13px; }
  .note-row .meta time { color: var(--fg); flex: none; }
  .note-row .meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-row[aria-current="true"] { background: var(--select); color: var(--select-fg); }
  .note-row[aria-current="true"] .meta, .note-row[aria-current="true"] .meta time { color: var(--select-fg); }

  .task-row { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s2) var(--s3) 0; border-radius: var(--r-row); transition: opacity .35s var(--ease), transform .35s var(--ease); }
  .task-row.leaving { opacity: 0; transform: translateX(8px); }
  .task-row .body { flex: 1; min-width: 0; padding-bottom: var(--s2); border-bottom: 1px solid var(--line); }
  .task-row .title { width: 100%; text-align: left; overflow-wrap: anywhere; }
  .task-row .due { font-size: 12px; color: var(--fg-2); }
    .task-row .due.overdue { color: var(--danger); }
  .task-row.done .title { color: var(--fg-3); }
  .task-row[aria-current="true"] { background: var(--select-quiet); }
  .task-row[aria-current="true"] .body { border-color: transparent; }
  .task-row[aria-current="true"] .due:not(.overdue) { color: var(--fg-on-quiet); }
  .check {
    width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--fg-3); display: grid; place-items: center; transition: background .2s, border-color .2s;
  }
  .check svg { width: 12px; height: 12px; stroke: var(--check-mark); stroke-width: 2.4; fill: none; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .25s var(--ease); }
  .check[aria-checked="true"] { background: var(--check); border-color: var(--check); }
  .check[aria-checked="true"] svg { opacity: 1; transform: none; }
  .check { position: relative; }
  .check::after { content: ""; position: absolute; inset: -12px; }
  .check:hover { border-color: var(--check); }
  .add-row { display: flex; gap: var(--s3); align-items: center; padding: var(--s2) var(--s3); }
  .add-row .plus { width: 20px; height: 20px; display: grid; place-items: center; color: var(--fg-3); }
  .add-row input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 2px 0; }
  .add-row input::placeholder { color: var(--fg-3); }
  .date-chip { position: relative; display: inline-flex; align-items: center; gap: var(--s1); height: 26px; padding: 0 var(--s2); border-radius: 13px; color: var(--fg-2); font-size: 12px; flex: none; }
  .date-chip .i { width: 15px; height: 15px; }
  .date-chip:hover { background: var(--fill); color: var(--fg); }
  .date-chip.set { background: var(--fill); color: var(--fg); }
  .date-chip input { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .field-row .date-chip { font-size: 14px; height: 30px; padding: 0 var(--s3); border-radius: 15px; }
  .field-row .clear { color: var(--fg-2); font-size: 13px; }
  .field-row .clear:hover { color: var(--fg); }

  /* Detail pane */
  .detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .detail .toolbar { justify-content: flex-end; }
  .detail .toolbar .spacer { flex: 1; }
  .paper { flex: 1; overflow-y: auto; padding: 0 var(--s6) var(--s7); }
  .paper-inner { max-width: 68ch; margin: 0 auto; }
  .stamp-gap { height: var(--s5); }
  .stamp { text-align: center; color: var(--fg-3); font-size: 12px; margin: var(--s1) 0 var(--s5); }
  .title-field {
    width: 100%; border: 0; background: none; outline: none; padding: 0; margin-bottom: var(--s3);
    font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -.015em; caret-color: var(--accent);
  }
  .body-field {
    width: 100%; min-height: 40vh; border: 0; background: none; outline: none; resize: none; padding: 0;
    font-size: 15px; line-height: 1.6; caret-color: var(--accent);
  }
  .rendered { font-size: 15px; line-height: 1.6; min-height: 40vh; cursor: text; overflow-wrap: anywhere; }
  .rendered:focus-visible { outline: none; }
  .rendered > :first-child { margin-top: 0; }
  .rendered p { margin: 0 0 var(--s3); }
  .rendered h2 { font-size: 19px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; margin: var(--s5) 0 var(--s2); }
  .rendered h3 { font-size: 16px; font-weight: 600; margin: var(--s4) 0 var(--s1); }
  .rendered ul { margin: 0 0 var(--s3); padding-left: 1.25em; }
  .rendered li { margin: 2px 0; }
  .rendered li::marker { color: var(--fg-3); }
  .rendered .placeholder { color: var(--fg-3); }
  .field-row { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid var(--line); color: var(--fg-2); }
  .field-row:last-of-type { border-bottom: 1px solid var(--line); margin-bottom: var(--s5); }
  .field-row .label { width: 72px; flex: none; }
    .detail-empty { flex: 1; display: grid; place-items: center; color: var(--fg-3); }

  /* Phone: one pane at a time */
  @media (max-width: 760px) {
    body { overflow: auto; }
    .app { display: block; height: auto; min-height: 100dvh; }
    .sidebar, .list, .detail { min-height: 100dvh; }
    .app:not([data-view="sidebar"]) .sidebar,
    .app:not([data-view="list"]) .list,
    .app:not([data-view="detail"]) .detail { display: none; }
    .sidebar { padding-top: calc(var(--s5) + env(safe-area-inset-top)); }
    .list { border-right: 0; }
    .icon-btn.back { display: flex; align-items: center; }
    .toolbar { height: calc(52px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); }
    .nav-item { height: 44px; font-size: 16px; }
    .paper { padding: 0 var(--s4) var(--s7); }
    .rows { padding-bottom: var(--s7); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
