<!doctype html>
<!-- One-click registration of the Bojji GitHub App from github-app-manifest.json.
     Run `npm start`, open http://localhost:5173/register-app.html and click.
     GitHub sends you back to /registered (this same page): it checks the state,
     the local server turns the code into credentials (.bojji-app.json), and the
     page opens Bojji, ready to sign in. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register Bojji</title>
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap; src: url(fonts/inter-latin-wght-normal.woff2) format("woff2"); }
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1d1d1f; --fg-2: #6e6e73; --fg-3: #66666b; --fill: #f2f2f5; --line: #e5e5ea;
    --check: #e0a800; --accent: #b07d00; --danger: #b8000f; --focus: #0071e3;
    --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .08);
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --fg: #f5f5f7; --fg-2: #a1a1a6; --fg-3: #8e8e93; --fill: #2c2c2e; --line: #38383a;
      --check: #ffcc00; --accent: #ffd426; --danger: #ff6961; --focus: #4da3ff;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 32px 16px;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
  main { width: 100%; max-width: 340px; text-align: center; }
  button, a.btn { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  .crown { width: 64px; height: 64px; margin: 0 auto 24px; }
  .crown path { fill: var(--check); stroke: var(--fg); stroke-width: 2.4; stroke-linejoin: round; }
  .crown circle { fill: var(--fg); }
  h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
  p { margin: 0 0 32px; color: var(--fg-2); text-wrap: pretty; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 44px; border: 0; border-radius: 22px;
    font-weight: 600; color: var(--bg); background: var(--fg); text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; border: 0; background: none; color: var(--fg-2); font-size: 14px; padding: 4px 8px; }
  .link:hover { color: var(--fg); }
  .link svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .error { color: var(--danger); margin: 16px 0 0; font-size: 14px; }
  .spin { width: 28px; height: 28px; margin: 0 auto 16px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--fg); }
  @media (prefers-reduced-motion: no-preference) { .spin { animation: spin .8s linear infinite; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  dialog { border: 0; padding: 24px; border-radius: 18px; width: min(520px, calc(100vw - 32px)); background: var(--bg); color: var(--fg); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgb(0 0 0 / .32); backdrop-filter: blur(6px); }
  dialog h2 { margin: 0 0 4px; font-size: 17px; }
  dialog p { margin: 0 0 16px; font-size: 13px; }
  pre { margin: 0 0 16px; max-height: 50dvh; overflow: auto; background: var(--fill); border-radius: 10px; padding: 12px 14px; font-size: 12px; line-height: 1.5; }
  [hidden] { display: none !important; }
</style>
<main>
  <svg class="crown" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 50 13 16l12 14 7-20 7 20 12-14 3 34z"/><circle cx="32" cy="40" r="3"/></svg>

  <section id="start">
    <h1>Register Bojji on GitHub</h1>
    <p>One click creates the Bojji GitHub App in your account, with only the access it needs.</p>
    <form method="post" id="form">
      <input type="hidden" name="manifest" id="field">
      <button class="btn" type="submit" disabled id="go">Create the GitHub App</button>
    </form>
    <button class="link" id="show" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4c-2 0-3 1-3 3v2c0 1.5-1 3-2 3 1 0 2 1.5 2 3v2c0 2 1 3 3 3M16 4c2 0 3 1 3 3v2c0 1.5 1 3 2 3-1 0-2 1.5-2 3v2c0 2-1 3-3 3"/></svg>
      What gets created
    </button>
  </section>

  <section id="finish" hidden>
    <div class="spin" id="spin"></div>
    <h1 id="finish-title">Finishing up…</h1>
    <p id="finish-text">Saving the app’s keys on this computer.</p>
    <a class="btn" href="/" id="open" hidden>Open Bojji</a>
  </section>

  <p class="error" id="error" hidden></p>
</main>

<dialog id="manifest-dialog" aria-labelledby="manifest-title">
  <h2 id="manifest-title">The GitHub App manifest</h2>
  <p>Read and write file contents, and read metadata. Nothing else.</p>
  <pre id="manifest">Loading…</pre>
  <button class="btn" id="close" type="button">Done</button>
</dialog>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const fail = (message) => { $('error').textContent = message; $('error').hidden = false; $('spin').hidden = true; };
  const dialog = $('manifest-dialog');
  $('show').onclick = () => dialog.showModal();
  $('close').onclick = () => dialog.close();
  dialog.onclick = (e) => { if (e.target === dialog) dialog.close(); };

  const params = new URLSearchParams(location.search);
  if (location.pathname === '/registered' && params.get('code')) {
    $('start').hidden = true; $('finish').hidden = false;
    const expected = sessionStorage.getItem('bojji.register.state');
    if (!expected || expected !== params.get('state')) {
      fail('This link didn’t start here. Open /register-app.html and try again.');
    } else {
      sessionStorage.removeItem('bojji.register.state');
      history.replaceState(null, '', '/registered');
      const res = await fetch('/api/register-app', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: params.get('code') }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        fail(body.error ?? 'GitHub didn’t accept the code. It lasts an hour and works once; register again.');
      } else {
        $('spin').hidden = true;
        $('finish-title').textContent = 'Bojji is ready';
        $('finish-text').textContent = 'Opening Bojji so you can sign in with GitHub.';
        $('open').hidden = false;
        setTimeout(() => location.assign('/'), 1400);
      }
    }
  } else {
    const manifest = await (await fetch('github-app-manifest.json')).json();
    $('manifest').textContent = JSON.stringify(manifest, null, 2);
    $('field').value = JSON.stringify(manifest);
    const state = crypto.randomUUID();
    sessionStorage.setItem('bojji.register.state', state);
    $('form').action = `https://github.com/settings/apps/new?state=${state}`;
    $('go').disabled = false;
  }
</script>
</html>
